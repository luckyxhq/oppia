<div [hidden]="!isGraphShown()" class="oppia-state-graph-animate-show">

  <!-- Tab Buttons -->
  <div class="preview-tabs">
    <button class="preview-tab-button" [class.active]="activeTab === 'overview'" (click)="switchTab('overview')"
      aria-label="Overview Tab">
      <i class="fa fa-sitemap"></i> Overview
    </button>
    <button class="preview-tab-button" [class.active]="activeTab === 'preview'" (click)="switchTab('preview')"
      aria-label="Card Preview Tab">
      <i class="fa fa-eye"></i> Card Preview
    </button>
  </div>

  <!-- Overview Tab Content -->
  <div *ngIf="activeTab === 'overview'" class="oppia-exp-graph-overview">
    <span class="oppia-exploration-overview-text">
      <strong tabindex="0">Exploration Overview</strong>
    </span>
    <div>
      <span *ngIf="!showCheckpointCountWarningSign()">&#11088;</span>
      <span ngbTooltip="{{checkpointCountWarning}}" placement="top-right" *ngIf="showCheckpointCountWarningSign()">
        <strong class="clickable">⚠️</strong>
      </span>
      <span [ngClass]="{'checkpoint-count-error': showCheckpointCountWarningSign()}" tabindex="0">
        {{ getCheckpointCount() }}
        <span *ngIf="getCheckpointCount() <= 1">
          Checkpoint
        </span>
        <span *ngIf="getCheckpointCount() > 1">
          Checkpoints
        </span>
      </span>
      <span ngbTooltip="Learners start at their last saved checkpoint when returning back from the lesson."
        placement="right-top" tabindex="0" class="clickable">
        <strong>&#x24D8;</strong>
      </span>
    </div>
    <mat-card class="oppia-state-graph-card">
      <div class="oppia-state-graph-container e2e-test-exploration-graph">
        <state-graph-visualization class="h-100" [currentStateId]="getActiveStateName()"
          (onClickFunction)="onClickStateInMinimap($event)" (onDeleteFunction)="deleteState($event)"
          (onMaximizeFunction)="openStateGraphModal()" [versionGraphData]="null" [maximize]="true" [allowPanning]="true"
          [centerAtCurrentState]="true" [isEditable]="isEditable()" [showWarningSign]="true">
        </state-graph-visualization>
      </div>
    </mat-card>
  </div>

  <!-- Card Preview Tab Content -->
  <div *ngIf="activeTab === 'preview'" class="card-preview-tab-content">
    <card-live-preview></card-live-preview>
  </div>

  <div class="oppia-exp-graph-modal-icon-container e2e-test-mobile-graph-resize-button" (click)="openStateGraphModal()">
    <i class="fa fa-expand-arrows-alt"></i>
  </div>
</div>

<style>
  /* Tab Buttons Styling */
  .preview-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 2px solid #e0e0e0;
    background: #f8f9fa;
    padding: 8px 8px 0 8px;
    border-radius: 8px 8px 0 0;
  }

  .preview-tab-button {
    background: none;
    border: none;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px 4px 0 0;
  }

  .preview-tab-button i {
    font-size: 14px;
  }

  .preview-tab-button:hover {
    color: #00609c;
    background: rgba(0, 96, 156, 0.05);
  }

  .preview-tab-button.active {
    color: #00609c;
    background: white;
    border-bottom-color: #00609c;
    font-weight: 600;
  }

  .card-preview-tab-content {
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .oppia-exp-graph-modal-icon-container {

    display: none;
  }

  .oppia-exploration-overview-text {
    font-size: 16px;
  }

  .oppia-state-graph-card {
    background-color: #fff;
    margin: 20px 0;
    padding: 8px;
  }

  @media screen and (max-width: 768px) {
    .oppia-exp-graph-overview {
      display: none;
    }

    .oppia-exp-graph-modal-icon-container {
      background-color: #fff;
      border: 2px solid #707070;
      display: block;
      padding: 6px;
      position: absolute;
      right: 40px;
      top: 75px;
    }

    .oppia-exp-graph-modal-icon-container span {
      font-size: 26px;
    }
  }

  .clickable {
    cursor: pointer;
  }

  exploration-graph span.checkpoint-count-error {
    color: #c55f45;
  }
</style>
