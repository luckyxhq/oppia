<div class="lesson-progress-bar-container" *ngIf="isVisible && totalParts > 0" style="color: #ffffff !important;">
  <div class="lesson-progress-text" style="color: #ffffff !important;">
    <span class="e2e-test-lesson-progress-text" style="color: #ffffff !important;">
      Created {{ createdParts }} question{{ createdParts !== 1 ? 's' : '' }} out of {{ totalParts }} part{{ totalParts !== 1 ? 's' : '' }}
    </span>
    <span class="lesson-progress-percentage" style="color: #ffffff !important;">({{ progressPercentage }}%)</span>
  </div>
  <div class="lesson-progress-bar-wrapper" 
       [attr.aria-label]="'Progress bar: ' + progressPercentage + ' percent complete'"
       style="background-color: rgba(255, 255, 255, 0.2) !important; height: 6px !important; width: 100% !important; display: block !important; visibility: visible !important; border-radius: 10px !important;">
    <div
      class="lesson-progress-bar-fill"
      [style.width.%]="progressPercentage"
      [attr.aria-label]="'Progress: ' + progressPercentage + ' percent'"
      [style.min-width.px]="progressPercentage > 0 ? 2 : 0"
      style="display: block !important; visibility: visible !important; height: 100% !important; border-radius: 10px !important; background: #4caf50 !important;">
    </div>
  </div>
</div>
