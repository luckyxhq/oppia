<div class="lesson-progress-bar-container" *ngIf="isVisible && totalParts > 0" style="color: #fff !important;">
  <div class="lesson-progress-text" style="color: #fff !important;">
    <span class="e2e-test-lesson-progress-text" style="color: #fff !important;">
      Created {{ createdParts }} question{{ createdParts !== 1 ? 's' : '' }} out of {{ totalParts }} part{{ totalParts
      !== 1 ? 's' : '' }}
    </span>
    <span class="lesson-progress-percentage" style="color: #fff !important;">({{ progressPercentage }}%)</span>
  </div>
  <div class="lesson-progress-bar-wrapper"
    [attr.aria-label]="'Progress bar: ' + progressPercentage + ' percent complete'"
    style="background-color: rgba(255, 255, 255, 0.2) !important; border-radius: 10px !important; display: block !important; height: 6px !important; visibility: visible !important; width: 100% !important;">
    <div class="lesson-progress-bar-fill" [style.width.%]="progressPercentage"
      [attr.aria-label]="'Progress: ' + progressPercentage + ' percent'"
      [style.min-width.px]="progressPercentage > 0 ? 2 : 0"
      style="background: #4caf50 !important; border-radius: 10px !important; display: block !important; height: 100% !important; visibility: visible !important;">
      >
    </div>
  </div>
</div>
